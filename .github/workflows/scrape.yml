name: Scrape trigger

# Keeps the scraper running 24/7 for free, independent of cron-job.org.
# GitHub's smallest schedule granularity is 5 minutes, so each run keeps
# pinging beyond the next scheduled start. The next run cancels and replaces
# it, which avoids the old one-minute blind spot between workflow runs.

on:
  schedule:
    # Offset from the start of the hour, where GitHub's scheduler is busiest.
    - cron: '2-59/5 * * * *'
  workflow_dispatch: {}

# Don't pile up overlapping runs; a fresh schedule supersedes a lingering one.
concurrency:
  group: scrape-trigger
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # Scheduled workflow events can be delayed or dropped. Keep the current
    # trigger alive for GitHub's six-hour job maximum; a newer run replaces it.
    timeout-minutes: 360
    steps:
      - name: Ping cron every 15s
        env:
          CRON_URL: https://truesource-web-pink.vercel.app/api/cron?key=${{ secrets.CRON_SECRET }}
        run: |
          # 1,440 pings at a 15-second cadence cover six hours. Normally a new
          # scheduled run replaces this one after five minutes. If GitHub delays
          # that event, this run keeps monitoring instead of leaving a blind spot.
          for i in $(seq 1 1440); do
            started=$(date +%s)
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 40 "$CRON_URL" || true)
            code=${code:-000}
            echo "ping $i -> HTTP $code at $(date -u +%H:%M:%S)"
            elapsed=$(($(date +%s) - started))
            wait=$((15 - elapsed))
            if [ "$i" -lt 1440 ] && [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          done
