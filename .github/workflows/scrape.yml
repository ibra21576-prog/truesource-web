name: Scrape trigger

# Keeps the scraper running 24/7 for free, independent of cron-job.org.
# GitHub's smallest schedule granularity is 5 minutes, so each run keeps
# pinging beyond the next scheduled start. The next run cancels and replaces
# it, which avoids the old one-minute blind spot between workflow runs.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

# Don't pile up overlapping runs; a fresh schedule supersedes a lingering one.
concurrency:
  group: scrape-trigger
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Ping cron every 15s
        env:
          CRON_URL: https://truesource-web-pink.vercel.app/api/cron?key=${{ secrets.CRON_SECRET }}
        run: |
          # Forty pings cover roughly ten minutes. A new scheduled run normally
          # replaces this one after five, while the overlap protects against a
          # delayed GitHub scheduler start.
          for i in $(seq 1 40); do
            started=$(date +%s)
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 40 "$CRON_URL" || true)
            code=${code:-000}
            echo "ping $i -> HTTP $code at $(date -u +%H:%M:%S)"
            elapsed=$(($(date +%s) - started))
            wait=$((15 - elapsed))
            if [ "$i" -lt 40 ] && [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          done
